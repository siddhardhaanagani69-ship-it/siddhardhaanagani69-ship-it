<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Siddhardha Anagani — Building intelligence. Making it useful.</title>
<desc id="desc">AI engineering, computer vision, LLMs and native apps. A dark keynote-inspired banner with a blue and violet horizon.</desc>
<defs>
<radialGradient id="halo"><stop stop-color="#695cff" stop-opacity=".75"/><stop offset=".5" stop-color="#3478f6" stop-opacity=".3"/><stop offset="1" stop-color="#080910" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#9bdcff"/><stop offset=".5" stop-color="#b8a4ff"/><stop offset="1" stop-color="#f2b8df"/></linearGradient>
</defs>
<rect width="1200" height="440" rx="24" fill="#080910"/>
<ellipse cx="900" cy="420" rx="560" ry="300" fill="url(#halo)"/>
<path d="M480 440 Q850 240 1200 370" fill="none" stroke="#a99cff" stroke-opacity=".24"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="76" fill="#c7c8d4" font-size="17" font-weight="600" letter-spacing="3">SIDDHARDHA ANAGANI</text>
<text x="60" y="175" fill="#f5f5f7" font-size="66" font-weight="700" letter-spacing="-2.6">Building intelligence.</text>
<text x="60" y="252" fill="url(#accent)" font-size="66" font-weight="700" letter-spacing="-2.6">Making it useful.</text>
<text x="64" y="310" fill="#bfc2d3" font-size="22">Computer vision. LLMs. Native apps.</text>
<rect x="64" y="358" width="8" height="8" rx="4" fill="#9bdcff"/>
