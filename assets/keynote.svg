<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Siddhardha Anagani — AI meets everyday life.</title>
<desc id="desc">Computer vision, language models, and native apps. Dark editorial design with a luminous blue and violet orbital sculpture.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080a12"/><stop offset="1" stop-color="#111022"/></linearGradient>
<linearGradient id="type" x2="1" y2=".4"><stop stop-color="#b8e8ff"/><stop offset=".5" stop-color="#b9a5ff"/><stop offset="1" stop-color="#f3b9ea"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7f7ff"/><stop offset=".28" stop-color="#70baff"/><stop offset=".58" stop-color="#8264ff"/><stop offset=".83" stop-color="#eda8f0"/><stop offset="1" stop-color="#7a6aff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#7657ff" stop-opacity=".4"/><stop offset="1" stop-color="#7657ff" stop-opacity="0"/></radialGradient>
<radialGradient id="sphere" cx=".3" cy=".22" r=".85"><stop stop-color="#334a79"/><stop offset=".4" stop-color="#171c38"/><stop offset="1" stop-color="#090b17"/></radialGradient>
</defs>
<rect width="1280" height="520" rx="28" fill="url(#bg)"/>
<circle cx="1020" cy="252" r="286" fill="url(#glow)"/>
<g transform="translate(1020 250)">
<circle r="135" fill="url(#sphere)" stroke="#7577aa" stroke-opacity=".25"/>
<ellipse rx="187" ry="74" transform="rotate(-46)" fill="none" stroke="url(#ring)" stroke-width="21"/>
<ellipse rx="187" ry="74" transform="rotate(35)" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".55"/>
<circle cx="122" cy="-142" r="7" fill="#d6eaff"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="64" y="66" fill="#c3c5d5" font-size="16" font-weight="600" letter-spacing="3">SIDDHARDHA ANAGANI</text>
<text x="60" y="171" fill="#f5f5f7" font-size="80" font-weight="700" letter-spacing="-4">AI meets</text>
<text x="60" y="259" fill="url(#type)" font-size="80" font-weight="700" letter-spacing="-4">everyday life.</text>
<text x="65" y="316" fill="#c1c3d2" font-size="22">Models that see. Apps that help.</text>
<text x="65" y="350" fill="#c1c3d2" font-size="22">Software built around people.</text>
<path d="M64 402H1216" stroke="#ffffff" stroke-opacity=".12"/>
<text x="65" y="451" fill="#a4abc2" font-size="14" letter-spacing="2">COMPUTER VISION</text>
<text x="310" y="451" fill="#a4abc2" font-size="14" letter-spacing="2">LLMs + RAG</text>
<text x="501" y="451" fill="#a4abc2" font-size="14" letter-spacing="2">NATIVE iOS</text>
<text x="1216" y="451" text-anchor="end" fill="#d6c8ff" font-size="14" letter-spacing="2">IDEA → IMPLEMENTATION</text>
</g>
</svg>
